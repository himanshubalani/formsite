services:
  - type: web
    name: formsite-web
    runtime: node
    rootDir: apps/web
    buildCommand: npm install -g pnpm && cd ../.. && pnpm install && pnpm turbo build --filter=@repo/web
    startCommand: pnpm start

  - type: web
    name: formsite-api
    runtime: node
    rootDir: apps/api
    buildCommand: npm install -g pnpm && cd ../.. && pnpm install && pnpm turbo build --filter=@repo/api
    startCommand: node dist/index.js

databases:
  - name: formsite-db
